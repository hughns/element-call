
buildscript {
    dependencies {
        classpath 'com.android.tools.build:gradle:8.8.0' 
    }   
}

plugins {
    id 'com.android.library' version '8.8.0' apply true
    id 'maven-publish'
}

repositories {
    google()
    mavenCentral()
}

android {
    namespace = "io.element.call.embedded"
    compileSdk 34
}

project.ext {
  MAVEN_GROUP = property("MAVEN_GROUP")
  MAVEN_ARTIFACT = property("MAVEN_ARTIFACT")
  MAVEN_VERSION_NAME = property("MAVEN_VERSION_NAME")
}
publishing {
  repositories {
    maven {
      name = "GitHubPackages"
      url = "https://maven.pkg.github.com/hughns/element-call"
      credentials {
        username = System.getenv("GITHUB_ACTOR")
        password = System.getenv("GITHUB_TOKEN")
      }
    }
  }

