name: Build & publish images to the package registries for releases

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build_element_call:
    if: ${{ github.event_name == 'release' }}
    uses: ./.github/workflows/build-element-call.yaml
    with:
      vite_app_version: ${{ github.event.release.tag_name || github.sha }}
    secrets:
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_URL: ${{ secrets.SENTRY_URL }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  publish_tarball:
    needs: build_element_call
    if: always()
    name: Publish tarball
    runs-on: ubuntu-latest
    outputs:
      unix_time: ${{steps.current-time.outputs.unix_time}}
    permissions:
      contents: write # required to upload release asset
      packages: write
    steps:
      - name: 📥 Download artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          name: build-output
          path: dist
      - name: Create Tarball
        env:
          TARBALL_VERSION: ${{ github.event.release.tag_name }}
        run: |
          tar --numeric-owner --transform "s/dist/element-call-${TARBALL_VERSION}/" -cvzf element-call-${TARBALL_VERSION}.tar.gz dist
          sha256sum element-call-${TARBALL_VERSION}.tar.gz > element-call-${TARBALL_VERSION}.tar.gz.sha256
      - name: Upload
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            element-call-${{ github.event.release.tag_name }}.tar.gz
            element-call-${{ github.event.release.tag_name }}.tar.gz.sha256
  publish_docker:
    needs: build_element_call
    if: always()
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build-and-publish-docker.yaml
    with:
      artifact_run_id: ${{ github.event.workflow_run.id || github.run_id }}
      docker_tags: |
        type=sha,format=short,event=branch
        type=semver,pattern=v{{version}}
