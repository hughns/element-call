name: Build & publish images to the package registries for releases

on:
  release:
    types: [published]

jobs:
  build_element_call:
    if: ${{ github.event_name == 'release' }}
    uses: ./.github/workflows/build-element-call.yaml
    with:
      vite_app_version: ${{ github.event.release.tag_name }}

  publish_tarball:
    needs: build_element_call
    if: always()
    name: Publish tarball
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to upload release asset
      packages: write
    steps:
      - name: 📥 Download built element-call artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          name: build-output
          path: dist
      - name: Create Tarball
        env:
          TARBALL_VERSION: ${{ github.event.release.tag_name }}
        run: |
          tar --numeric-owner --transform "s/dist/element-call-${TARBALL_VERSION}/" -cvzf element-call-${TARBALL_VERSION}.tar.gz dist
          sha256sum element-call-${TARBALL_VERSION}.tar.gz > element-call-${TARBALL_VERSION}.tar.gz.sha256
      - name: Upload
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            element-call-${{ github.event.release.tag_name }}.tar.gz
            element-call-${{ github.event.release.tag_name }}.tar.gz.sha256

  publish_docker:
    needs: build_element_call
    if: always()
    name: Publish docker
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build-and-publish-docker.yaml
    with:
      artifact_run_id: ${{ github.event.workflow_run.id || github.run_id }}
      docker_tags: |
        type=sha,format=short,event=branch
        type=semver,pattern=v{{version}}
  add_docker_release_note:
    needs: publish_docker
    name: Add docker release note
    runs-on: ubuntu-latest
    steps:
      - name: Add release note
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          body: |
            ## Docker
            Element Call is available as a Docker image from the [GitHub Container Registry](https://github.com/element-hq/element-call/pkgs/container/element-call).

            ```
            docker pull ghcr.io/element-hq/element-call:${{ github.event.release.tag_name }}
            ```

  publish_npm:
    needs: build_element_call
    if: always()
    name: Publish NPM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: 📥 Download built element-call artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4        
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          name: build-output
          path: embedded/web/dist

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: 'https://npm.pkg.github.com'
          scope: '@hughns'
      - name: Publish npm
        working-directory: embedded/web
        run: |
          npm version ${{ github.event.release.tag_name }} --no-git-tag-version
          echo "NPM_VERSION=$(jq '.version' --raw-output package.json)" >> "$GITHUB_ENV"
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add release note
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          body: |
            ## NPM
            ```
            npm install @hughns/element-call@${{ env.NPM_VERSION }}
            ```

  publish_android:
    needs: build_element_call
    if: always()
    name: Publish Android AAR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: 📥 Download built element-call artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4        
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          name: build-output
          path: embedded/android/lib/src/main/assets/element-call

      - name: ☕️ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get version
        run: |
          VERSION=${{ github.event.release.tag_name }}
          echo "VERSION=${VERSION:1}" >> $GITHUB_ENV

      - name: Publish AAR to GitHub package registry
        env:
          EC_VERSION: ${{ env.VERSION }}
        run: embedded/android/publish_android_package.sh -s
          
      - name: Add release note
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          body: |
            ## Android
            ```
            dependencies {
              implementation 'io.element.call:embedded-element-call:${{ env.VERSION}}'
            }
            ```

  publish_ios:
    needs: build_element_call
    if: always()
    name: Publish SwiftPM Library
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: element-call
      
      - name: 📥 Download built element-call artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4        
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          name: build-output
          path: element-call/embedded/ios/Sources/dist


      - name: Get version
        run: |
          VERSION=${{ github.event.release.tag_name }}
          echo "VERSION=${VERSION:1}" >> $GITHUB_ENV
          
      - name: Checkout element-call-swift
        uses: actions/checkout@v4
        with:
          repository: element-hq/element-call-swift
          path: element-call-swift
          token: ${{ secrets.SWIFT_RELEASE_TOKEN }}
      
      - name: Copy files
        run: rsync -a --delete --exclude .git element-call/embedded/ios/ element-call-swift
      
      - name: Commit and tag
        working-directory: element-call-swift
        run: |
          git config --global user.email "hughns@element.io"
          git config --global user.name "Hugh Nimmo-Smith"
          git add -A
          git commit -am "Release ${{ env.VERSION }}"
          git tag -a ${{ env.VERSION }} -m "${{ github.event.release.html_url }}"
          git push --tags
          
      - name: Add release note
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          body: |
            ## iOS
            ```
            .package(url: "https://github.com/element-hq/element-call-swift.git", from: "${{ env.VERSION }}")
            ```            
