name: Build & publish embedded packages for releases

on:
  release:
    types: [published]

jobs:
  build_element_call:
    if: ${{ github.event_name == 'release' }}
    uses: ./.github/workflows/build-element-call.yaml
    with:
      vite_app_version: ${{ github.event.release.tag_name }}
      embedded: true

  publish_tarball:
    needs: build_element_call
    if: always()
    name: Publish tarball
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to upload release asset
      packages: write
    env:
      FILENAME_PREFIX: element-call-embedded-${{ github.event.release.tag_name }}
    steps:
      - name: 📥 Download built element-call artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          name: build-output
          path: ${{ env.FILENAME_PREFIX}}
      - name: Create Tarball
        run: tar --numeric-owner -cvzf ${{ env.FILENAME_PREFIX }}.tar.gz ${{ env.FILENAME_PREFIX }}
      - name: Create Checksum
        run: sha256sum ${{ env.FILENAME_PREFIX }}/**/* > ${{ env.FILENAME_PREFIX }}.sha256
      - name: Upload
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.FILENAME_PREFIX }}.tar.gz
            ${{ env.FILENAME_PREFIX }}.sha256

  publish_npm:
    needs: build_element_call
    if: always()
    name: Publish NPM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 📥 Download built element-call artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          name: build-output
          path: embedded/web/dist

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: "https://npm.pkg.github.com"
          scope: "@hughns"
      - name: Publish npm
        working-directory: embedded/web
        run: |
          npm version ${{ github.event.release.tag_name }} --no-git-tag-version
          echo "NPM_VERSION=$(jq '.version' --raw-output package.json)" >> "$GITHUB_ENV"
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add release note
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          body: |
            ## NPM

            This package provides a version of Element Call that can be both used as an embedded widget within another application.

            ```
            npm install @hughns/element-call@${{ env.NPM_VERSION }}
            ```

  publish_android:
    needs: build_element_call
    if: always()
    name: Publish Android AAR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 📥 Download built element-call artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          name: build-output
          path: embedded/android/lib/src/main/assets/element-call

      - name: ☕️ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Get version
        run: |
          VERSION=${{ github.event.release.tag_name }}
          echo "VERSION=${VERSION:1}" >> $GITHUB_ENV

      - name: Publish AAR to GitHub package registry
        env:
          EC_VERSION: ${{ env.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: embedded/android/publish_android_package.sh -s

      - name: Add release note
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          body: |
            ## Android AAR

            This package provides a version of Element Call that can be both used as an embedded widget within another application.

            ```
            dependencies {
              implementation 'io.element.call:embedded-element-call:${{ env.VERSION}}'
            }
            ```

  publish_ios:
    needs: build_element_call
    if: always()
    name: Publish SwiftPM Library
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: element-call

      - name: 📥 Download built element-call artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          name: build-output
          path: element-call/embedded/ios/Sources/dist

      - name: Get version
        run: |
          VERSION=${{ github.event.release.tag_name }}
          echo "VERSION=${VERSION:1}" >> $GITHUB_ENV

      - name: Checkout element-call-swift
        uses: actions/checkout@v4
        with:
          repository: element-hq/element-call-swift
          path: element-call-swift
          token: ${{ secrets.SWIFT_RELEASE_TOKEN }}

      - name: Copy files
        run: rsync -a --delete --exclude .git element-call/embedded/ios/ element-call-swift

      - name: Commit and tag
        working-directory: element-call-swift
        run: |
          git config --global user.email "hughns@element.io"
          git config --global user.name "Hugh Nimmo-Smith"
          git add -A
          git commit -am "Release ${{ env.VERSION }}"
          git tag -a ${{ env.VERSION }} -m "${{ github.event.release.html_url }}"
          git push --tags

      - name: Add release note
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          body: |
            ## Swift PM

            This package provides a version of Element Call that can be both used as an embedded widget within another application.

            ```
            .package(url: "https://github.com/element-hq/element-call-swift.git", from: "${{ env.VERSION }}")
            ```
